name: Compilar APK Mi Balance

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el cÃ³digo
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configurar Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Compilar y ejecutar pruebas
        run: gradle assembleDebug testDebugUnitTest
        working-directory: MiBalance

      - name: Subir el APK
        uses: actions/upload-artifact@v4
        with:
          name: Mi-Balance-apk
          path: MiBalance/app/build/outputs/apk/debug/app-debug.apk
